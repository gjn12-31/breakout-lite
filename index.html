<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout-Lite · 打砖块</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="hud">
  <span>得分 <b id="score">0</b></span>
  <span>关卡 <b id="level">1</b></span>
  <span>生命 <b id="lives">♥♥♥</b></span>
  <span>最高 <b id="high">0</b></span>
</div>

<div id="stage">
  <canvas id="game" width="480" height="600"></canvas>
  <div id="banner"></div>

  <div class="overlay" id="menu">
    <h1>BREAKOUT<br>LITE</h1>
    <p>点击开始 或按 <span class="key">Enter</span></p>
    <p>鼠标 / ←→ 移动 · 空格发球与激光 · <span class="key">P</span> 暂停 · <span class="key">M</span> 静音</p>
    <button id="start-btn">START</button>
  </div>

  <div class="overlay hidden" id="over">
    <h2 id="over-title">GAME OVER</h2>
    <p id="over-score">Score: 0</p>
    <p id="over-high">Best: 0</p>
    <button id="retry-btn">RETRY</button>
  </div>
</div>

<p class="hint">接住掉落的道具获得强化 · 不可摧毁的砖块画有斜纹 · 最高分保存在本地</p>

<div id="legend">
  <span><i class="chip" style="background:#2ed573">E</i>挡板加宽</span>
  <span><i class="chip" style="background:#1e90ff">M</i>多球</span>
  <span><i class="chip" style="background:#ff6b81">L</i>激光炮</span>
  <span><i class="chip" style="background:#a55eea">S</i>慢速球</span>
  <span><i class="chip" style="background:#ffa502">T</i>粘性挡板</span>
  <span><i class="chip" style="background:#ff4d4d">+</i>加一条命</span>
  <span><i class="chip" style="background:#84817a">-</i>挡板变窄(小心)</span>
  <span><i class="chip" style="background:#55606b">X</i>不可摧毁</span>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
